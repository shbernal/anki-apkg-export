version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Mirrors the `minimumReleaseAgeStrict` posture in pnpm-workspace.yaml:
    # never propose a release that pnpm would still refuse to install.
    cooldown:
      default-days: 7
    groups:
      # oxlint and its type-aware sidecar must move together: oxlint-tsgolint's
      # version tracks the TypeScript release it was built against, and a
      # mismatched pair silently drops the type-aware rules. Listed first so it
      # wins over the broader dev group below.
      oxc:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - oxfmt
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
