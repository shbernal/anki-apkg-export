name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Nothing in the test suite imports dist/: the suites run against src/ so
      # they need no build. The example does import it, so running it is what
      # covers the exports map, the emitted extensions and the import.meta
      # resolve that finds the sql.js WASM. It writes into the working
      # directory, hence the temp one, and it logs failures rather than exiting
      # non-zero — so the deck itself is what gets checked.
      - name: Smoke-test the built package
        run: |
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/examples/server/server.js"
          test -s output.apkg

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
