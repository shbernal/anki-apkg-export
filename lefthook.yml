# Commit-message rules shared across every repo here, so the regex has one
# definition rather than one copy per project. Lefthook fetches this on `install`
# and caches it under .git/info/lefthook-remotes/; refetch_frequency is what lets
# a fix in the shared repo ever arrive. The tag is pinned on purpose — a branch
# would mean any push there changes what this repo runs.
#
# Jobs merge rather than override, so adding a local commit-msg job later does
# not displace this one.
remotes:
  - git_url: https://github.com/shbernal/lefthook-rules
    ref: v1
    configs:
      - rules/no-ai-attribution.yml
    refetch_frequency: 24h

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}"
      # Mirrors ignorePatterns in .oxfmtrc.json. Without it, a commit touching
      # only ignored files — regenerating test/fixtures/*.json, say — hands
      # oxfmt a list that resolves to nothing, which it exits 2 on.
      exclude:
        - "test/fixtures/*"
        - "examples/assets/*"
        - "pnpm-lock.yaml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec oxlint --deny-warnings {staged_files}

pre-push:
  jobs:
    - name: lint
      run: pnpm run lint
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: pnpm test
