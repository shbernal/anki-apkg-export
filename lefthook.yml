pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,md,yml,yaml}"
      # Mirrors ignorePatterns in .oxfmtrc.json. Without it, a commit touching
      # only ignored files — regenerating test/fixtures/*.json, say — hands
      # oxfmt a list that resolves to nothing, which it exits 2 on.
      exclude:
        - "test/fixtures/*"
        - "examples/assets/*"
        - "pnpm-lock.yaml"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec oxlint --deny-warnings {staged_files}

pre-push:
  jobs:
    - name: lint
      run: pnpm run lint
    - name: typecheck
      run: pnpm run typecheck
    - name: test
      run: pnpm test
